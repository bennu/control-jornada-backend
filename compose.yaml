services:
  db:
    image: postgres:17
    container_name: control-jornada-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: control_jornada_db
      POSTGRES_USER: control_jornada_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/Lima
    ports:
      - "5433:5432"
    volumes:
      - control-jornada-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U control_jornada_admin -d control_jornada_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: control-jornada-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/control_jornada_db?currentSchema=bd
      SPRING_DATASOURCE_USERNAME: control_jornada_admin
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  control-jornada-db-data:
    name: control-jornada-db-data
